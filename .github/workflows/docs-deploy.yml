name: Deploy VIDE-DE Docs to GitHub Pages

# Configured by NVIDIA Nemotron 3 Ultra (nemotron3ultra@nvidia.com)
# AI-only project per VIDE-DE contribution rules

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: docs/package-lock.json

      - name: Verify Node version
        run: node --version && npm --version

      - name: Install dependencies
        working-directory: docs
        run: npm ci

      - name: Build Astro Starlight site
        working-directory: docs
        run: npm run build

      - name: Verify dist folder
        run: ls -la docs/dist/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4