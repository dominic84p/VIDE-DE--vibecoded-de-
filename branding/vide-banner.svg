<!-- branding/vide-banner.svg -->
<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 1280 400"
  width="1280"
  height="400"
  role="img"
  aria-label="VIDE-DE"
>
  <title>VIDE-DE</title>

  <defs>
    <linearGradient
      id="vide-gradient"
      gradientUnits="userSpaceOnUse"
      x1="238.4"
      y1="87.8"
      x2="372.8"
      y2="304"
    >
      <stop offset="0" stop-color="#2D46FF" />
      <stop offset="0.52" stop-color="#12DFF3" />
      <stop offset="1" stop-color="#6BFF4D" />
    </linearGradient>
    <linearGradient
      id="vide-backdrop"
      x1="0"
      y1="0"
      x2="1"
      y2="1"
    >
      <stop offset="0" stop-color="#141C36" />
      <stop offset="1" stop-color="#080C18" />
    </linearGradient>
    <radialGradient
      id="vide-glow-blue"
      cx="0.12"
      cy="0.1"
      r="0.6"
    >
      <stop offset="0" stop-color="#2D46FF" stop-opacity="0.45" />
      <stop offset="1" stop-color="#2D46FF" stop-opacity="0" />
    </radialGradient>
    <radialGradient
      id="vide-glow-green"
      cx="0.92"
      cy="1"
      r="0.55"
    >
      <stop offset="0" stop-color="#6BFF4D" stop-opacity="0.28" />
      <stop offset="1" stop-color="#6BFF4D" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- backdrop -->
  <rect
    width="1280"
    height="400"
    rx="28"
    fill="url(#vide-backdrop)"
  />
  <rect
    width="1280"
    height="400"
    rx="28"
    fill="url(#vide-glow-blue)"
  />
  <rect
    width="1280"
    height="400"
    rx="28"
    fill="url(#vide-glow-green)"
  />

  <g
    fill="url(#vide-gradient)"
    stroke="url(#vide-gradient)"
    stroke-width="5.6"
    stroke-linejoin="round"
  >
    <!-- upper left pane -->
    <polygon points="219.4,95.7 282.1,95.7 322.4,179.7 261.8,179.7" />
    <!-- upper right pane -->
    <polygon points="436.6,95.7 373.9,95.7 333.6,179.7 394.2,179.7" />
    <!-- lower left pane -->
    <polygon points="267.5,190.9 322.4,190.9 322.4,299.6" />
    <!-- lower right pane -->
    <polygon points="388.5,190.9 333.6,190.9 333.6,299.6" />
    <!-- spark -->
    <path d="M328 78.9 Q332.5 102.4 356 106.9 Q332.5 111.4 328 134.9 Q323.5 111.4 300 106.9 Q323.5 102.4 328 78.9Z" />
  </g>

  <g
    fill="#FFFFFF"
    transform="translate(479.4 157.2) scale(1)"
  >
    <!-- V -->
    <polygon points="0,0 26.9,0 52,51.7 77.1,0 104,0 61,100 43,100" />
    <!-- I -->
    <rect x="126" y="0" width="24" height="100" />
    <!-- D -->
    <path fill-rule="evenodd" d="M172 0 H210 A50 50 0 0 1 210 100 H172Z M196 24 V76 H210 A26 26 0 0 0 210 24Z" />
    <!-- E -->
    <path d="M282 0 H352 V22.1 H306 V39 H342 V61 H306 V77.9 H352 V100 H282Z" />
    <!-- - -->
    <rect x="374" y="39" width="40" height="22.1" />
    <!-- D -->
    <path fill-rule="evenodd" d="M436 0 H474 A50 50 0 0 1 474 100 H436Z M460 24 V76 H474 A26 26 0 0 0 474 24Z" />
    <!-- E -->
    <path d="M546 0 H616 V22.1 H570 V39 H606 V61 H570 V77.9 H616 V100 H546Z" />
  </g>
</svg>
