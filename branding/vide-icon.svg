<!-- branding/vide-icon.svg -->
<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 512 512"
  width="512"
  height="512"
  role="img"
  aria-label="VIDE-DE app icon"
>
  <title>VIDE-DE app icon</title>

  <defs>
    <linearGradient
      id="vide-gradient"
      gradientUnits="userSpaceOnUse"
      x1="144"
      y1="125.8"
      x2="312"
      y2="396"
    >
      <stop offset="0" stop-color="#2D46FF" />
      <stop offset="0.52" stop-color="#12DFF3" />
      <stop offset="1" stop-color="#6BFF4D" />
    </linearGradient>
    <linearGradient
      id="vide-tile"
      x1="0"
      y1="0"
      x2="0"
      y2="1"
    >
      <stop offset="0" stop-color="#18203A" />
      <stop offset="1" stop-color="#0B1020" />
    </linearGradient>
  </defs>

  <!-- tile -->
  <rect
    width="512"
    height="512"
    rx="112"
    fill="url(#vide-tile)"
  />
  <rect
    x="1.5"
    y="1.5"
    width="509"
    height="509"
    rx="110.5"
    fill="none"
    stroke="#FFFFFF"
    stroke-opacity="0.08"
    stroke-width="3"
  />

  <g
    fill="url(#vide-gradient)"
    stroke="url(#vide-gradient)"
    stroke-width="7"
    stroke-linejoin="round"
  >
    <!-- upper left pane -->
    <polygon points="120.2,129.6 198.6,129.6 249,234.6 173.2,234.6" />
    <!-- upper right pane -->
    <polygon points="391.8,129.6 313.4,129.6 263,234.6 338.8,234.6" />
    <!-- lower left pane -->
    <polygon points="180.3,248.6 249,248.6 249,384.5" />
    <!-- lower right pane -->
    <polygon points="331.7,248.6 263,248.6 263,384.5" />
    <!-- spark -->
    <path d="M256 108.6 Q261.6 138 291 143.6 Q261.6 149.2 256 178.6 Q250.4 149.2 221 143.6 Q250.4 138 256 108.6Z" />
  </g>
</svg>
