[package]
name = "snip-and-sketchy"
version = "0.1.0"
edition = "2024"
description = "Snip & Sketchy: mark up screenshots. Like Snip & Sketch, but sketchier."

[dependencies]
vide-fonts = { path = "../fonts" }
eframe = "0.37"
egui_extras = { version = "0.37", features = ["image", "svg", "file"] }
png = "0.18"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
